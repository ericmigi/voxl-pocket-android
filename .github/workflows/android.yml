name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach the APK to releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Require the release key for releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STORE: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # A debug-signed release could never be upgraded to a properly signed one.
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$STORE" ] || [ -z "$ALIAS" ] || [ -z "$KEY" ]; then
            echo "::error::Signing secrets are missing; refusing to publish a debug-signed release."
            exit 1
          fi

      - name: Build and test
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "voxl-pocket-android-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: voxl-pocket-android
          path: voxl-pocket-android-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" voxl-pocket-android-*.apk --title "$GITHUB_REF_NAME" --generate-notes
